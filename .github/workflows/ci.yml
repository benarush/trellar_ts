name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24", "26"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # The Strands Agents SDK needs Node 22+; on Node 20 install it without engine enforcement.
        run: npm install --no-audit --no-fund --engine-strict=false

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests (all frameworks)
        if: matrix.node-version != '20'
        run: npm test

      - name: Run tests (core + LangChain; Strands needs Node 22+)
        if: matrix.node-version == '20'
        run: npx vitest run --exclude tests/strandsCallback.test.ts

      - name: Build
        run: npm run build

      - name: Smoke-test the built package (ESM + CJS)
        run: npm run smoke
